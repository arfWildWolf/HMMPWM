<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gatekeeper TIS Predictor</title>
    <style>
        :root {
            /* Dark Theme Variables */
            --bg: #0f172a;
            --surface: #1e293b;
            --border: #334155;
            --primary: #38bdf8;
            --primary-hover: #0284c7;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --track-color: #475569;
            --tis-color: #f43f5e;
            --btn-alt-bg: #334155;
            --btn-alt-hover: #475569;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        
        body { background-color: var(--bg); color: var(--text-main); padding: 2rem; display: flex; flex-direction: column; align-items: center; }
        
        .dashboard { background: var(--surface); width: 100%; max-width: 900px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.5); overflow: hidden; margin-bottom: 2rem; border: 1px solid var(--border); }
        
        .header { padding: 1.5rem; border-bottom: 1px solid var(--border); }
        .header h1 { font-size: 1.5rem; font-weight: 600; }
        
        .tabs { display: flex; border-bottom: 1px solid var(--border); background: #0f172a; }
        .tab-btn { flex: 1; padding: 1rem; border: none; background: none; font-weight: 500; color: var(--text-muted); cursor: pointer; transition: all 0.2s; }
        .tab-btn:hover { color: var(--text-main); }
        .tab-btn.active { background: var(--surface); color: var(--primary); border-bottom: 2px solid var(--primary); }
        
        .tab-content { padding: 1.5rem; display: none; }
        .tab-content.active { display: block; }
        
        .form-group { margin-bottom: 1rem; }
        label { display: block; font-size: 0.875rem; font-weight: 500; margin-bottom: 0.5rem; }
        
        input[type="text"], input[type="number"], textarea, select { 
            width: 100%; 
            padding: 0.75rem; 
            border: 1px solid var(--border); 
            border-radius: 6px; 
            font-size: 1rem; 
            background: var(--bg); 
            color: var(--text-main); 
        }
        textarea { height: 120px; resize: vertical; font-family: monospace; }
        
        .calc-note { font-size: 0.85rem; color: var(--text-muted); margin-top: 0.5rem; background: var(--bg); padding: 0.5rem; border-radius: 4px; border: 1px dashed var(--border); }
        
        .dropzone { border: 2px dashed var(--border); border-radius: 8px; padding: 2rem; text-align: center; color: var(--text-muted); cursor: pointer; transition: border-color 0.2s; background: var(--bg); }
        .dropzone:hover { border-color: var(--primary); }
        .dropzone input { display: none; }
        
        .action-bar { padding: 1.5rem; border-top: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; background: #0f172a;}
        .left-actions { display: flex; align-items: center; gap: 1rem; }
        .right-actions { display: flex; align-items: center; gap: 1rem; }
        .error-text { color: var(--tis-color); font-size: 0.9rem; font-weight: 500; display: none; }
        
        button.run-btn { background: var(--primary); color: white; border: none; padding: 0.75rem 1.5rem; border-radius: 6px; font-weight: 600; cursor: pointer; transition: background 0.2s; }
        button.run-btn:hover { background: var(--primary-hover); }
        button.run-btn:disabled { background: var(--track-color); cursor: not-allowed; color: var(--text-muted); }

        /* Visualization Area */
        .viz-container { background: var(--surface); width: 100%; max-width: 900px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.5); padding: 2rem; display: none; border: 1px solid var(--border); }
        
        .viz-header { margin-bottom: 2rem; display: flex; justify-content: space-between; align-items: flex-start; }
        .viz-header-controls { display: flex; gap: 0.75rem; flex-wrap: wrap; justify-content: flex-end; }
        
        button.action-btn { background: var(--btn-alt-bg); color: var(--text-main); border: 1px solid var(--border); padding: 0.5rem 1rem; border-radius: 6px; font-weight: 500; cursor: pointer; transition: background 0.2s; font-size: 0.9rem; }
        button.action-btn:hover { background: var(--btn-alt-hover); }
        button.export-btn { background: #10b981; color: white; border: none; } 
        button.export-btn:hover { background: #059669; }

        .stats { display: flex; gap: 2rem; font-size: 0.9rem; color: var(--text-muted); margin-top: 0.5rem; }
        .stat-box strong { color: var(--text-main); font-size: 1.1rem; display: block; }
        
        .track-wrapper { position: relative; width: 100%; height: 160px; overflow-x: hidden; overflow-y: hidden; }
        .svg-track { min-width: 100%; height: 100%; display: block; }

        /* List View Styles */
        .list-wrapper { max-height: 300px; overflow-y: auto; padding-right: 1rem; border: 1px solid var(--border); border-radius: 8px; padding: 1rem; background: var(--bg); display: none; }
        .pos-list { list-style: none; display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 0.5rem; }
        .pos-item { background: var(--surface); border: 1px solid var(--border); padding: 0.5rem; border-radius: 4px; text-align: center; font-family: monospace; font-size: 0.95rem; font-weight: 600; color: var(--primary); box-shadow: 0 1px 2px rgb(0 0 0 / 0.5);}
        .pos-item span { color: var(--text-muted); font-size: 0.8rem; display: block; font-weight: normal; }
        .empty-state { color: var(--text-muted); font-style: italic; grid-column: 1 / -1; }

        /* SVG Glow class */
        .glow-filter { filter: url(#glow); }
        /* Add pointer cursor for hover states on compressed ticks */
        .highlight-tick { cursor: pointer; }
    </style>
</head>
<body>

    <div class="dashboard">
        <div class="header">
            <h1>Gatekeeper Meta-Ensemble</h1>
        </div>
        
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('ncbi')">NCBI Accession</button>
            <button class="tab-btn" onclick="switchTab('upload')">Upload Fasta/Txt</button>
            <button class="tab-btn" onclick="switchTab('paste')">Paste String</button>
        </div>

        <div id="ncbi" class="tab-content active">
            <div class="form-group">
                <label>Accession ID</label>
                <input type="text" id="acc-id" placeholder="e.g., NM_001126112.2">
            </div>
            <div style="display: flex; gap: 1rem;">
                <div class="form-group" style="flex: 1;">
                    <label>Start Range</label>
                    <input type="number" id="acc-start" placeholder="e.g., 1000" oninput="updateAlignment()">
                </div>
                <div class="form-group" style="flex: 1;">
                    <label>End Range</label>
                    <input type="number" id="acc-end" placeholder="e.g., 2500" oninput="updateAlignment()">
                </div>
            </div>
            <div class="calc-note" id="alignment-note">
                Codon-Aligned Range: Waiting for input... (Will snap start down and end up to ensure % 3 == 0)
            </div>
        </div>

        <div id="upload" class="tab-content">
            <div class="dropzone" onclick="document.getElementById('file-input').click()">
                <p id="file-label">Click to select or drag and drop a .fasta or .txt file here.</p>
                <input type="file" id="file-input" accept=".fasta,.txt,.fa" onchange="updateFileLabel()">
            </div>
        </div>

        <div id="paste" class="tab-content">
            <div class="form-group">
                <label>Raw Nucleotide Sequence</label>
                <textarea id="raw-seq" placeholder="ATGGCC..."></textarea>
            </div>
        </div>

        <div class="action-bar">
            <div class="left-actions">
                <label style="margin:0;"><strong>Model:</strong></label>
                <select id="model-strategy">
                    <option value="v3">V3 (Contextual Gatekeeper)</option>
                    <option value="hmm_tokenized">HMM (Viterbi Tokenized)</option>
                    <option value="baseline">Baseline (Naive Tokenized)</option>
                </select>
            </div>
            <div class="right-actions">
                <div id="error-msg" class="error-text"></div>
                <button id="run-btn" class="run-btn" onclick="runPrediction()">Run Gatekeeper Prediction</button>
            </div>
        </div>
    </div>

    <div id="viz" class="viz-container">
        <div class="viz-header">
            <div>
                <h2>Structural Prediction</h2>
                <div class="stats">
                    <div class="stat-box">Length: <strong id="stat-len">-</strong></div>
                    <div class="stat-box">TIS Detected: <strong id="stat-count">-</strong></div>
                </div>
            </div>
            <div class="viz-header-controls">
                <button id="toggle-expand-btn" class="action-btn" onclick="toggleExpansion()">Expand Track</button>
                <button id="toggle-view-btn" class="action-btn" onclick="toggleViewMode()">View as List</button>
                <button class="action-btn export-btn" onclick="exportToCSV()">Export to CSV</button>
            </div>
        </div>
        
        <div class="track-wrapper" id="track-scroll">
            <svg id="svg-canvas" class="svg-track"></svg>
        </div>

        <div class="list-wrapper" id="list-scroll">
            <ul class="pos-list" id="positions-list"></ul>
        </div>
    </div>

    <script>
        const API_BASE = "http://localhost:8000";
        let activeTab = 'ncbi';
        
        // Global state variables
        let latestResults = null;
        let isListView = false;
        let isExpanded = false; // Controls compressed vs expanded track mode

        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            event.currentTarget.classList.add('active');
            activeTab = tabId;
        }

        function updateAlignment() {
            const startStr = document.getElementById('acc-start').value;
            const endStr = document.getElementById('acc-end').value;
            const note = document.getElementById('alignment-note');
            
            if(!startStr || !endStr) {
                note.innerText = "Codon-Aligned Range: Waiting for input...";
                return;
            }
            const start = parseInt(startStr);
            const end = parseInt(endStr);
            const alignedStart = start - (start % 3);
            const alignedEnd = end + ((3 - (end % 3)) % 3);
            note.innerHTML = `<strong>Codon-Aligned Range:</strong> Base ${alignedStart} to ${alignedEnd} <em>(Length: ${alignedEnd - alignedStart} bp)</em>`;
        }

        function updateFileLabel() {
            const fileInput = document.getElementById('file-input');
            const label = document.getElementById('file-label');
            if(fileInput.files.length > 0) {
                label.innerText = `Selected: ${fileInput.files[0].name}`;
            }
        }

        function showError(msg) {
            const err = document.getElementById('error-msg');
            err.innerText = msg;
            err.style.display = 'block';
        }

        function hideError() {
            document.getElementById('error-msg').style.display = 'none';
        }

        async function runPrediction() {
            hideError();
            const btn = document.getElementById('run-btn');
            btn.disabled = true;
            btn.innerText = "Predicting...";
            document.getElementById('viz').style.display = 'none';

            const selectedStrategy = document.getElementById('model-strategy').value;

            try {
                let response;
                
                if (activeTab === 'ncbi') {
                    const acc = document.getElementById('acc-id').value;
                    const start = document.getElementById('acc-start').value;
                    const end = document.getElementById('acc-end').value;
                    if(!acc || !start || !end) throw new Error("Please fill all NCBI fields.");
                    
                    const fd = new FormData();
                    fd.append('accession', acc);
                    fd.append('start', start);
                    fd.append('end', end);
                    fd.append('strategy', selectedStrategy);
                    response = await fetch(`${API_BASE}/predict/ncbi`, { method: 'POST', body: fd });
                } 
                else if (activeTab === 'upload') {
                    const fileInput = document.getElementById('file-input');
                    if(fileInput.files.length === 0) throw new Error("Please select a file.");
                    
                    const fd = new FormData();
                    fd.append('file', fileInput.files[0]);
                    fd.append('strategy', selectedStrategy);
                    response = await fetch(`${API_BASE}/predict/file`, { method: 'POST', body: fd });
                } 
                else if (activeTab === 'paste') {
                    const seq = document.getElementById('raw-seq').value;
                    if(!seq || seq.length < 53) throw new Error("Sequence must be at least 53bp long.");
                    
                    const fd = new FormData();
                    fd.append('sequence', seq);
                    fd.append('strategy', selectedStrategy);
                    response = await fetch(`${API_BASE}/predict/string`, { method: 'POST', body: fd });
                }

                if (!response.ok) {
                    const errData = await response.json();
                    throw new Error(errData.detail || "Server Error");
                }

                const data = await response.json();
                latestResults = data;
                renderVisualization(data);
                
            } catch (error) {
                showError(error.message);
            } finally {
                btn.disabled = false;
                btn.innerText = "Run Gatekeeper Prediction";
            }
        }

        function toggleViewMode() {
            isListView = !isListView;
            const trackView = document.getElementById('track-scroll');
            const listView = document.getElementById('list-scroll');
            const toggleViewBtn = document.getElementById('toggle-view-btn');
            const toggleExpandBtn = document.getElementById('toggle-expand-btn');

            if (isListView) {
                trackView.style.display = 'none';
                listView.style.display = 'block';
                toggleViewBtn.innerText = "View as Graphical Track";
                toggleExpandBtn.style.display = 'none'; 
            } else {
                trackView.style.display = 'block';
                listView.style.display = 'none';
                toggleViewBtn.innerText = "View as List";
                toggleExpandBtn.style.display = 'inline-block';
            }
        }

        function toggleExpansion() {
            isExpanded = !isExpanded;
            const btn = document.getElementById('toggle-expand-btn');
            if (isExpanded) {
                btn.innerText = "Compress Track";
            } else {
                btn.innerText = "Expand Track";
            }
            if (latestResults) renderVisualization(latestResults);
        }

        function exportToCSV() {
            if (!latestResults) {
                alert("No prediction data to export.");
                return;
            }

            const details = latestResults.tis_details || (latestResults.tis_positions || []).map(p => ({pos: p, score: "N/A"}));

            let csvContent = "data:text/csv;charset=utf-8,";
            csvContent += "Detected_TIS_Position,Score\n";

            if (details.length === 0) {
                csvContent += "No TIS detected,\n";
            } else {
                details.forEach(item => {
                    const s = typeof item.score === 'number' ? item.score.toFixed(4) : item.score;
                    csvContent += `${item.pos},${s}\n`;
                });
            }

            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", "gatekeeper_tis_predictions.csv");
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        function renderVisualization(data) {
            const { sequence_length, offset_start } = data;
            const details = data.tis_details || (data.tis_positions || []).map(p => ({pos: p, score: 1.0}));
            
            document.getElementById('viz').style.display = 'block';
            document.getElementById('stat-len').innerText = `${sequence_length} bp`;
            document.getElementById('stat-count').innerText = details.length;

            // --- 1. RENDER LIST VIEW ---
            const ul = document.getElementById('positions-list');
            ul.innerHTML = '';
            if (details.length === 0) {
                ul.innerHTML = '<li class="empty-state">No TIS candidates detected by the model in this sequence.</li>';
            } else {
                details.forEach(item => {
                    const li = document.createElement('li');
                    li.className = 'pos-item';
                    const scoreDisplay = typeof item.score === 'number' ? item.score.toFixed(2) : '1.0';
                    li.innerHTML = `Pos: ${item.pos} <span>Score: ${scoreDisplay}</span>`;
                    ul.appendChild(li);
                });
            }

            // --- 2. RENDER GRAPHICAL SVG ---
            const svg = document.getElementById('svg-canvas');
            
            // Re-inject the SVG Glow Filter definition
            svg.innerHTML = `
                <defs>
                    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
                        <feGaussianBlur stdDeviation="3" result="blur" />
                        <feComposite in="SourceGraphic" in2="blur" operator="over" />
                    </filter>
                </defs>
            `;

            const trackHeight = 160;
            const paddingX = 40;
            const containerWidth = document.getElementById('track-scroll').clientWidth;
            
            let requiredWidth;
            if (isExpanded) {
                const minWidthPerMarker = 80; 
                requiredWidth = Math.max(containerWidth, (details.length * minWidthPerMarker) + (paddingX * 2));
                document.getElementById('track-scroll').style.overflowX = "auto";
            } else {
                requiredWidth = containerWidth;
                document.getElementById('track-scroll').style.overflowX = "hidden";
            }

            svg.setAttribute('width', requiredWidth);
            svg.setAttribute('height', trackHeight);

            const drawAreaWidth = requiredWidth - (paddingX * 2);

            // Base track line
            const trackLine = document.createElementNS("http://www.w3.org/2000/svg", "rect");
            trackLine.setAttribute("x", paddingX);
            trackLine.setAttribute("y", 100);
            trackLine.setAttribute("width", drawAreaWidth);
            trackLine.setAttribute("height", 10);
            trackLine.setAttribute("rx", 5);
            trackLine.setAttribute("fill", "var(--track-color)");
            svg.appendChild(trackLine);

            details.forEach(item => {
                const relativePos = item.pos - offset_start;
                const ratio = relativePos / sequence_length;
                const x = paddingX + (ratio * drawAreaWidth);

                let rawScore = typeof item.score === 'number' ? item.score : 1.0;
                let opacity = Math.max(0.3, Math.min(1.0, rawScore));
                const glowColor = `rgba(136, 220, 192, ${opacity})`; 

                const group = document.createElementNS("http://www.w3.org/2000/svg", "g");
                group.setAttribute("class", "glow-filter");

                if (!isExpanded) {
                    // COMPRESSED MODE: Just a glowing notch on the track
                    const notch = document.createElementNS("http://www.w3.org/2000/svg", "rect");
                    notch.setAttribute("x", x - 3);
                    notch.setAttribute("y", 95); // Slightly overlaps the track vertically
                    notch.setAttribute("width", 6);
                    notch.setAttribute("height", 20);
                    notch.setAttribute("rx", 3);
                    notch.setAttribute("fill", glowColor);
                    notch.setAttribute("class", "highlight-tick");

                    // Native SVG hover tooltip for the notch
                    const title = document.createElementNS("http://www.w3.org/2000/svg", "title");
                    title.textContent = `Pos: ${item.pos}\nScore: ${rawScore.toFixed(2)}`;
                    notch.appendChild(title);

                    group.appendChild(notch);
                } else {
                    // EXPANDED MODE: Full pin, arrow, pill, and text
                    const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
                    line.setAttribute("x1", x);
                    line.setAttribute("y1", 50);
                    line.setAttribute("x2", x);
                    line.setAttribute("y2", 100);
                    line.setAttribute("stroke", glowColor);
                    line.setAttribute("stroke-width", "3");
                    group.appendChild(line);

                    const arrow = document.createElementNS("http://www.w3.org/2000/svg", "polygon");
                    arrow.setAttribute("points", `${x-6},90 ${x+6},90 ${x},105`);
                    arrow.setAttribute("fill", glowColor);
                    group.appendChild(arrow);

                    const textBg = document.createElementNS("http://www.w3.org/2000/svg", "rect");
                    textBg.setAttribute("x", x - 35);
                    textBg.setAttribute("y", 25);
                    textBg.setAttribute("width", 70);
                    textBg.setAttribute("height", 20);
                    textBg.setAttribute("rx", 4);
                    textBg.setAttribute("fill", glowColor);
                    group.appendChild(textBg);

                    const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
                    text.setAttribute("x", x);
                    text.setAttribute("y", 39);
                    text.setAttribute("text-anchor", "middle");
                    text.setAttribute("fill", "#ffffff"); 
                    text.setAttribute("font-size", "11px");
                    text.setAttribute("font-weight", "bold");
                    text.textContent = `Pos: ${item.pos}`;
                    group.appendChild(text);
                }

                svg.appendChild(group);
            });

            // Auto-scroll logic only applies when expanded
            if (details.length > 0 && isExpanded && !isListView) {
                const firstRatio = (details[0].pos - offset_start) / sequence_length;
                const scrollX = (firstRatio * drawAreaWidth) - (containerWidth / 2);
                document.getElementById('track-scroll').scrollLeft = Math.max(0, scrollX);
            }
        }
    </script>
</body>
</html>
